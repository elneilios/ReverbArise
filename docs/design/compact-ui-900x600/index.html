<h1>ReverbArise <span class="tag">900 × 600</span> — layout review</h1>
<p>Real FL Studio baselines and measured browser mockups. The mockup is exactly 900 × 600 CSS pixels, with no fit-to-page scaling. Keep browser zoom at 100%. These are layout proposals, not a running plugin or native control approval.</p>
<div class="tools"><select id="variant"><option value="a">A · Labelled inspector sections</option><option value="b">B · Scroll + pinned actions</option><option value="baseline">Real plugin · 1100 × 850</option></select><select id="mode"><option value="perform">Perform</option><option value="learn">Learn</option><option value="export">Export</option></select><button id="size-toggle">Show 1100 × 850 expansion</button><select id="typography" aria-label="Typography"><option value="responsive">Typography · responsive</option><option value="calm">Typography · calmer</option><option value="compact">Typography · revision 2</option></select><label><input id="future-check" type="checkbox">Future DSP</label><select id="review-size" aria-label="Review size"><option value="900x600">900 × 600</option><option value="1100x850">1100 × 850</option><option value="1400x1000">1400 × 1000</option></select><span id="dimensions">900 × 600 · 100%</span></div>
<div class="captionbar" id="caption"></div><div class="stage" id="stage"></div><div class="notes" id="notes"></div>
</main><script>
const qs=new URLSearchParams(location.search);let variant=qs.get('variant')||'a',mode=qs.get('mode')||'perform',section=qs.get('section')||'Envelope',learnSection='Generate',expanded=false;
if(qs.has('capture'))document.body.classList.add('capture');
const $=s=>document.querySelector(s),btn=(s,c='')=>`<button class="btn ${c}" type="button">${s}</button>`,entry=s=>`<div class="entry">${s}</div>`,select=s=>`<button class="select" type="button">${s}<span>⌄</span></button>`,folder=()=>btn('▱','folder'),sw=(on)=>`<span class="switch ${on?'on':''}"></span>`,bar=(v)=>`<div class="bar"><div class="track"></div><div class="entry value">${v} <span style="margin-left:auto">⌃</span></div></div>`;
function dial(v=.65){const a=2.2+v*5.02;return `<svg class="dial" viewBox="0 0 42 42" aria-hidden="true"><path d="M8.1 32.1 A17 17 0 1 1 33.9 32.1" stroke="#4a5058" stroke-width="3" fill="none"/><path d="M8.1 32.1 A17 17 0 ${v>.62?1:0} 1 ${21+17*Math.cos(a)} ${21+17*Math.sin(a)}" stroke="#00efff" stroke-width="3" fill="none"/><circle cx="${21+17*Math.cos(a)}" cy="${21+17*Math.sin(a)}" r="2" fill="#f8fafc"/></svg>`}
function cell(label,value,i=0,wide=false){return `<div class="cell ${wide?'wide':''}" data-control="${label}"><div class="caption">${label}</div><div class="cell-main">${dial(.25+(i%4)*.17)}${entry(value)}</div></div>`}
const values={Timing:[['Target (bars)','2.1.023'],['Move Wet (ms)','0'],['Source start (bars)','2.1.023'],['Source end (bars)','2.2.023']],Envelope:[['Pre-roll (s)','1.8'],['End Offset (s)','0.02'],['Fade In (ms)','0'],['Fade Out (ms)','20'],['Curve In','0'],['Curve Out','0']],Sound:[['Level (dB)','0']]};
function header(){const subtitles={learn:'Capture audio and discover musical moments',perform:'Shape and place reverse swells with precision',export:'Preview your prepared swells'};return `<header class="region header"><img class="wordmark" src="../../../resources/logo/svg/reverbarise-wordmark-dark.svg"><nav class="nav">${['learn','perform','export'].map(m=>`<button type="button" data-mode="${m}" class="${m===mode?'active':''}"><img src="../../../resources/icons/${m}.svg">${m[0].toUpperCase()+m.slice(1)}</button>`).join('')}</nav>${btn('⚙','settings')}<div class="description ell" title="${subtitles[mode]}">${subtitles[mode]}</div>${mode==='perform'?'<div class="notice ell" title="Caution: In Perform, swells can remain audible during DAW playback, even if the source is silent or muted."><span class="warn">ⓘ</span>Caution: In Perform, swells can remain audible during DAW playback, even if the source is silent or muted.</div>':mode==='export'?'<div class="notice info">ⓘ &nbsp; DAW wet is bypassed in Export</div>':''}</header>`}
function tabs(active,cls=''){return `<div class="section-tabs ${cls}">${['Timing','Envelope','Sound'].map(s=>`<button type="button" data-section="${s}" class="${s===active?'active':''}">${s}</button>`).join('')}</div>`}
function ir(){return `<div class="sound-ir"><div class="minor">Impulse Response (IR)</div><div class="row">${select('Preverb Hall')}${folder()}</div><div class="helper">Ready · Preverb Hall</div></div>`}
function flags(){return `<div class="flags">${['Enabled','Solo','Freeze'].map((s,i)=>`<button type="button"><span class="check ${i===0?'on':''}">${i===0?'✓':''}</span>${s}</button>`).join('')}</div>`}
function inspector(){return `<section class="region column inspector"><div class="inspector-head"><h2 class="heading">Selected Swell</h2><span class="ready-dot">Ready</span></div>${flags()}${tabs(variant==='a'?section:'','jump')}<div class="section-content">${variant==='a'?`${section==='Sound'?ir():''}<div class="cells">${values[section].map((v,i)=>cell(...v,i)).join('')}</div>`:`<div class="inspector-scroll">${ir()}${Object.entries(values).map(([s,vs])=>`<h3 id="group-${s}">${s==='Sound'?'Level':s}</h3><div class="cells">${vs.map((v,i)=>cell(...v,i,s==='Timing'&&i>1||s==='Sound')).join('')}</div>`).join('')}<div class="helper">End of selected-swell controls</div></div><div class="scroll-rail"></div><div class="scroll-cue">Scroll for more controls ↓</div>`}</div><div class="reset-footer">${btn('Reset','danger')}${btn('Reset All','danger')}</div></section>`}
function list(){return `<section class="region column list"><div class="list-head"><h2 class="heading">Swells</h2><span class="count">43</span>${btn('+','add')}</div>${Array.from({length:expanded?7:4},(_,i)=>`<div class="swell-row ${i===0?'selected':''}"><button class="row-menu" type="button" title="Rename / Delete">⋮</button><div class="swell-name ell"><span class="check on">✓</span>Swell Bar ${i+2}.1.023…</div><div class="swell-ir">Preverb Hall</div><div class="swell-ready">Ready</div></div>`).join('')}<div class="scrollhint">⌄ ${expanded?36:39} more swells</div></section>`}

function perform(){return `${list()}<section class="region column detail"><div class="height-control"><span>Height</span><div class="track"></div>${entry('0 dB')}</div><div class="ruler"><span>1.3</span><span>1.4</span><span>2.1</span><span>2.2</span></div><div class="lane"><label>Dry</label><img src="assets/dry-lane.png"></div><div class="lane wet"><label>Wet</label><img src="assets/wet-lane.png"></div><div class="readout ell">Target: 2.1.023 &nbsp; | &nbsp; Pre-roll: 1.80 s &nbsp; | &nbsp; Length: 1.82 s</div>${zoom()}<div class="snap-row"><span class="helper">Grid</span>${btn('Snap','aqua')}${select('1/4 beat')}</div></section>${inspector()}<section class="region audition"><h2 class="heading">Audition</h2>${btn('▶','aqua')}${btn('■')}${btn('Wet only','aqua wetonly')}<div class="helper ell">Ready | 1 swell | saved balance</div></section><section class="region overview"><div class="overview-top"><h2 class="heading">Overview</h2><div class="ruler"><span>1.1</span><span>3.1</span><span>5.1</span><span>7.1</span><span>9.1</span><span>11.1</span><span>13.1</span></div></div><img src="assets/overview.png"></section><div class="region host">Bar 1 &nbsp; | &nbsp; Beat 1 &nbsp; | &nbsp; 82 BPM &nbsp; | &nbsp; 4 / 4</div><div class="region help">Reset restores the wet shape. Source points, IR and activity stay unchanged.</div>`}
function toggle(label,on){return `<div class="learn-control"><span>${label}</span>${sw(on)}</div>`}
function learn(){let settings=variant==='a'?`<h2 class="heading">Source Capture</h2>${toggle('Recapture audio',false)}<div class="learn-sub">Keep captured audio.</div><div class="divider"></div><h2 class="heading automatic-title">Automatic Swells</h2>${toggle('Detect events',true)}${toggle('Generate on Stop',false)}<div class="label">Default IR</div><div class="row">${select('Preverb Hall')}${folder()}</div><div class="label">Event sensitivity</div>${bar('48.5 %')}${btn('Generate Swells','aqua generate')}<div class="helper reason">Ready to generate</div><div class="helper manual">Want to place swells yourself? Add manual swells in Perform.</div>`:`<h2 class="heading">Learn Settings</h2><div class="section-tabs learn-b-tabs">${['Capture','Generate'].map(s=>`<button type="button" data-learn-section="${s}" class="${learnSection===s?'active':''}">${s}</button>`).join('')}</div><div class="learn-b-content">${learnSection==='Capture'?`<h2 class="heading">Source Capture</h2>${toggle('Recapture audio',false)}<div class="helper">Keep captured audio.</div><div class="helper">Captured | 41.0 s | 43 events</div>`:`<h2 class="heading">Automatic Swells</h2>${toggle('Detect events',true)}${toggle('Generate on Stop',false)}<div class="label">Default IR</div><div class="row">${select('Preverb Hall')}${folder()}</div><div class="helper">Used by Generate.</div><div class="label">Event sensitivity</div>${bar('48.5 %')}`}</div><div class="learn-b-actions">${btn('Generate Swells','aqua generate')}<div class="helper reason">Ready to generate</div><div class="helper manual">Want to place swells yourself? Add manual swells in Perform.</div></div>`;return `<section class="region learn-left">${settings}</section><section class="region learn-right"><h2 class="heading">Audio</h2><div class="helper metadata">Captured | 41.0 s | 43 events</div><div class="ruler"><span>1.1</span><span>3.1</span><span>5.1</span><span>7.1</span><span>9.1</span><span>11.1</span><span>13.1</span><span>15.1</span></div><img src="assets/learn-waveform.png"><div class="helper">Captured source · events shown at their song positions</div></section><div class="region help">Default IR is used by Generate. Capture audio and discover musical moments.</div>`}
function exportView(){return `<section class="region export-left"><h2 class="heading">Export Preview</h2><div class="helper">Left-click/drag: preview position. Right-drag: pan. Wheel: zoom.</div><div class="ruler"><span>1.1</span><span>3.1</span><span>5.1</span><span>7.1</span><span>9.1</span><span>11.1</span><span>13.1</span></div><img class="export-wave" src="assets/export-waveform.png">${zoom()}<div class="export-play">${btn('▶','aqua')}${btn('■')}<div class="helper">Preview 0.000 s / 36.791 s | WAV 40.960 s</div></div></section><section class="region export-right"><h2 class="heading">Export Mix (Dry / Wet)</h2>${bar('100.0 %')}<div class="drag-tile"><svg viewBox="0 0 52 68" fill="none" stroke="#f8fafc" stroke-width="1.5"><path d="M5 2H34L48 16V64H5Z M34 2V16H48"/><path d="M12 32V40M18 27V44M24 30V41M30 25V45M36 32V39"/><path d="M5 47H48V64H5Z" fill="#00efff" stroke="none"/><text x="26" y="60" text-anchor="middle" fill="#0f1418" stroke="none" font-size="12">WAV</text></svg><strong>Drag WAV to Playlist</strong><div class="helper">Ready: 100.0% Wet | Song-aligned</div></div><div class="mix-help">● Wet 100.0% &nbsp; ○ Dry 0.0% (off)<br>Same accepted mix for preview and WAV.</div>${btn('⇩ &nbsp; Save WAV…')}${btn('↶ &nbsp; Return to Perform')}</section><div class="region help">Preview your prepared swells. DAW wet is bypassed in Export.</div>`}
function render(){document.documentElement.style.setProperty('--expanded',expanded?'1':'0');$('#variant').value=variant;$('#mode').value=mode;$('#dimensions').textContent=variant==='baseline'?'1100 × 850 · captured pixels':expanded?'1100 × 850 · responsive mockup':'900 × 600 · 100%';$('#caption').textContent=variant==='baseline'?'REAL PLUGIN · captured in FL Studio on 5 November 2026':`${variant.toUpperCase()} · ${mode.toUpperCase()} · DESIGN MOCKUP · normal type / 42 px dials / pinned actions`;$('#stage').innerHTML=variant==='baseline'?`<img class="baseline" src="baseline/${mode}-plugin.png">`:`<div class="plugin v-${variant} ${expanded?'expanded':''}">${header()}${mode==='perform'?perform():mode==='learn'?learn():exportView()}</div>`;$('#notes').innerHTML=variant==='baseline'?'<strong>Baseline:</strong> unaltered 1100 × 850 plugin-content crop; full FL Studio screenshots are saved alongside it. Reset is below the initial Perform viewport.':variant==='a'?'<strong>A — preferred starting point:</strong> Perform uses labelled Timing / Envelope / Sound sections; click each to see the complete control inventory. All six Envelope controls and both reset actions fit without scrolling. Learn keeps every current control in view. Export reduces the oversized drag tile. Section captions move above existing-size dials/values: this is a proposed composition change requiring native review.':'<strong>B — smaller change to the inspector:</strong> keep the long control stack, add labelled section jumps and a visible scrollbar, and pin Reset / Reset All. Learn has Capture / Generate sections with a persistent Generate action. Export uses a shorter drag target. Scroll and click the section links to inspect every control.';bind();if(expanded&&variant!=='baseline')expandLayout();}
function bind(){document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{if(variant==='a'){section=b.dataset.section;render()}else{$('#group-'+b.dataset.section)?.scrollIntoView({block:'start',behavior:'instant'})}});document.querySelectorAll('[data-learn-section]').forEach(b=>b.onclick=()=>{learnSection=b.dataset.learnSection;render()});}
function expandLayout(){const p=$('.plugin');p.style.width='1100px';p.style.height='850px';p.querySelector('.header').style.width='1076px';p.querySelector('.header .nav').style.right='48px';p.querySelector('.header .description').style.left='698px';p.querySelector('.header .notice')?.style.setProperty('width','682px');const h=p.querySelector('.help');h.style.width='1076px';if(mode==='perform'){p.querySelectorAll('.column').forEach(c=>c.style.height='530px');p.querySelector('.detail').style.width=variant==='a'?'616px':'588px';p.querySelector('.inspector').style.left=variant==='a'?'812px':'768px';p.querySelector('.section-content').style.height='388px';p.querySelector('.inspector-scroll')?.style.setProperty('height','388px');p.querySelectorAll('.lane').forEach(l=>l.style.height='208px');const wide=document.createElement('div');wide.className='navigation-wide';const z=p.querySelector('.detail .zoom-row'),sn=p.querySelector('.snap-row');z.before(wide);wide.append(z,sn);sn.querySelector('.helper').remove();p.querySelector('.audition').style.top='632px';p.querySelector('.audition').style.width='1076px';p.querySelector('.overview').style.top='680px';p.querySelector('.overview').style.width='1076px';p.querySelector('.overview').style.height='116px';p.querySelector('.overview img').style.width='1076px';p.querySelector('.overview img').style.height='80px';p.querySelector('.host').style.top='810px';p.querySelector('.host').style.width='1076px';}else if(mode==='learn'){p.querySelector('.learn-left').style.height='728px';p.querySelector('.learn-right').style.width='776px';p.querySelector('.learn-right img').style.height='388px';}else{p.querySelector('.export-left').style.width='758px';p.querySelector('.export-right').style.left='788px';p.querySelector('.export-wave').style.width='758px';p.querySelector('.export-wave').style.height='532px';}}
$('#variant').onchange=e=>{variant=e.target.value;render()};$('#mode').onchange=e=>{mode=e.target.value;render()};$('#size-toggle').onclick=()=>{expanded=!expanded;$('#size-toggle').textContent=expanded?'Return to 900 × 600':'Show 1100 × 850 expansion';render()};render();
</script><script src="option-a-v2.js"></script><script src="option-a-v3.js"></script><script src="option-a-v4.js"></script></body></html>
